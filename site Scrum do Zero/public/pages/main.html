<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/token-expiration-manager.js"></script>
    <script src="/assets/js/auth-guard.js"></script>
    <script type="module" src="/assets/js/main.js"></script>
    <script src="/assets/js/components/header.js"></script>
    <title>Scrum do Zero</title>
</head>
<body>

  <default-header></default-header>

  <main class="container initial-page-container">
    <section class="info-section-main">
      <div class="hero">
        <h1>Seja bem vindo ao Scrum do Zero</h1>
        <p>Escolha seu nível e avance no seu aprendizado em Scrum de forma prática e progressiva.</p>
        <p>Cada módulo foi desenvolvido para reforçar seus conhecimentos e preparar você para os próximos desafios.</p>
        <p>Selecione um nível para começar ou continue de onde parou.</p>
      </div>
    
      <div class="levels-card">
        <button class="level-btn" data-idLevel="1">Nível 1</button>
        <button class="level-btn" data-idLevel="2">Nível 2</button>
        <button class="level-btn" data-idLevel="3">Nível 3</button>
        <button class="level-btn" data-idLevel="4">Nível 4</button>
        <button class="level-btn" data-idLevel="5">Nível 5</button>
      </div>
    </section>
  </main>

  <dialog-modules></dialog-modules>

</body>
</html>
