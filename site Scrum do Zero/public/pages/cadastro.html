<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Página de cadastro de novos participantes no Scrum do Zero.">
  <link rel="canonical" href="/pages/cadastro.html">
  <title>Cadastro — Scrum do Zero</title>
  <link rel="stylesheet" href="/assets/css/style.css"/>
  <script src="/assets/js/components/header.js"></script>
  <script src="/assets/js/cadastro.js"></script>
</head>
<body class="body-color">

  <default-header></default-header>
  
  <main class="container cadastro-page">
    <section class="cadastro-card">
      <h1 class="cadastro-title">Cadastro</h1>
      <div id="mensagem" class="cadastro-mensagem" aria-live="polite"></div>

      <form id="cadastroForm" class="cadastro-form" novalidate>
        <div class="cadastro-field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" />
        </div>

        <div class="cadastro-field">
          <label for="sobrenome">Sobrenome</label>
          <input type="text" id="sobrenome" name="sobrenome" />
        </div>

        <div class="cadastro-field">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" maxlength="14" />
        </div>

        <div class="cadastro-field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" />
        </div>

        <div class="cadastro-field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" />
        </div>

        <div class="cadastro-field">
          <label for="confirmar">Confirme sua senha</label>
          <input type="password" id="confirmar" name="confirmar" />
        </div>

        <button type="submit" class="cadastro-btn">Cadastrar-se</button>
      </form>
    </section>
  </main>
</body>
</html>
