<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.css">
    <title>Cadastro</title>
</head>
<body>
  <header class="topbar">
    <img src="logo.png" alt="Logo Scrum" class="logo" />

    <nav class="menu" aria-label="Navegação principal">
      <a href="#">Histórico</a>
      <a href="#">Perfil</a>
      <a href="#">Certificado</a>
    </nav>
  </header>

  <main class="page">
    <section class="card">
      <h1>Cadastro</h1>
        <div id="mensagem" class="mensagem" aria-live="polite"></div>

      <form>
        <div class="field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" />
        </div>

        <div class="field">
          <label for="sobrenome">Sobrenome</label>
          <input type="text" id="sobrenome" />
        </div>

        <div class="field">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" />
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" />
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" />
        </div>

        <div class="field">
          <label for="confirmar">Confirme sua senha</label>
          <input type="password" id="confirmar" />
        </div>

        <button type="submit" class="btn">Cadastrar-se</button>
      </form>
    </section>
  </main>
  <script src="/assets/js/cadastro.js"></script>
  </body>
</html>
