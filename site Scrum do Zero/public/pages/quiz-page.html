<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/token-expiration-manager.js"></script>
  <script src="/assets/js/auth-guard.js"></script>
  <script type="module" src="/assets/js/quiz-page.js"></script>
  <meta name="description" content="Quiz interativo por módulo — responda perguntas e acompanhe seu progresso.">
  <link rel="canonical" href="/pages/quiz-page.html">
  <title>Quiz — Scrum do Zero</title>
</head>

<body class="body-quiz-color">

  <header class="progress-section">

    <div class="progress-wrapper" id="progressWrapper"></div>

    <h1 class="module-title"></h1>

  </header>

  <main class="quiz-main-section container-quiz">

    <section class="quiz-main-section">

      <div class="content-quiz-page">

        <div class="question-area">

          <h2 class="question-number" id="questionNumber">
            1 -
          </h2>

          <p class="question-text" id="questionText"></p>

        </div>

        <div class="options-area">

          <div class="options-box" id="optionsBox"></div>

        </div>

      </div>

      <!-- FOOTER -->
      <footer class="footer">

        <button class="footer-btn" id="prevBtn">Voltar</button>

        <button class="footer-btn" id="nextBtn">Prosseguir</button>

      </footer>

    </section>

    <dialog-quiz></dialog-quiz>

  </main>

</body>

</html>
